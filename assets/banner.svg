<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Animated Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }

      @keyframes pulseGlow {
        0% { opacity: 0.2; transform: scale(0.98); }
        50% { opacity: 0.5; transform: scale(1.02); }
        100% { opacity: 0.2; transform: scale(0.98); }
      }

      @keyframes borderShift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }

      .bg-particle {
        animation: floatParticle 6s ease-in-out infinite;
      }
      .bg-particle-delayed {
        animation: floatParticle 8s ease-in-out infinite 2s;
      }
      .glow-box {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-border {
        stroke-dasharray: 200 100;
        animation: borderShift 12s linear infinite;
      }
      .banner-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #ffffff;
      }
      .banner-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text) -->
  <g class="glow-box">
    <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="1050" cy="200" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
    <circle cx="600" cy="250" r="120" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Geometric Grid Background Pattern (Low Opacity) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
    <line x1="1000" y1="0" x2="1000" y2="280" />
  </g>

  <!-- Animated Particles (Floating in background) -->
  <circle class="bg-particle" cx="120" cy="210" r="6" fill="#818cf8" />
  <circle class="bg-particle-delayed" cx="980" cy="70" r="8" fill="#f472b6" />
  <circle class="bg-particle" cx="1080" cy="120" r="5" fill="#c084fc" />
  <circle class="bg-particle-delayed" cx="240" cy="60" r="7" fill="#38bdf8" />

  <!-- Glowing Accent Line under Top Border -->
  <rect x="50" y="2" width="1100" height="3" fill="url(#accent-grad)" rx="1.5" class="animated-border" />

  <!-- FOREGROUND LAYER: Badges & Text (Guaranteed on Top) -->
  <!-- Top Badge / Pill -->
  <g transform="translate(60, 42)">
    <rect width="210" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="105" y="19" text-anchor="middle" class="pill-text" fill="#a5b4fc">✨ October 2026 Edition</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="118" class="banner-title">Awesome SMB Enterprise Resource Planning (ERP)</text>

  <!-- Subtitle -->
  <text x="60" y="156" class="banner-subtitle">Curated Directory of Commercial SaaS &amp; Open-Source ERP Systems for Growing SMBs</text>

  <!-- Dynamic Feature Badges / Category Pills in Foreground -->
  <g transform="translate(60, 195)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="145" height="36" rx="18" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5" />
      <text x="72" y="23" text-anchor="middle" class="pill-text">📊 Accounting &amp; Finance</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(160, 0)">
      <rect width="165" height="36" rx="18" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="82" y="23" text-anchor="middle" class="pill-text">🏭 Manufacturing &amp; MRP</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(340, 0)">
      <rect width="155" height="36" rx="18" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5" />
      <text x="77" y="23" text-anchor="middle" class="pill-text">📦 Inventory &amp; Supply</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(510, 0)">
      <rect width="145" height="36" rx="18" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" />
      <text x="72" y="23" text-anchor="middle" class="pill-text">🌐 Open-Source ERP</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(670, 0)">
      <rect width="135" height="36" rx="18" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.5" />
      <text x="67" y="23" text-anchor="middle" class="pill-text">☁️ Commercial SaaS</text>
    </g>
  </g>
</svg>
